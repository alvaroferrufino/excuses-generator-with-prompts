<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Leonardo -->
  <circle cx="100" cy="100" r="50" fill="green" />
  <rect x="90" y="70" width="20" height="60" fill="blue" />
  <text x="100" y="180" font-size="20" text-anchor="middle" fill="black">Leonardo</text>

  <!-- Michelangelo -->
  <circle cx="300" cy="100" r="50" fill="green" />
  <rect x="290" y="70" width="20" height="60" fill="orange" />
  <text x="300" y="180" font-size="20" text-anchor="middle" fill="black">Michelangelo</text>

  <!-- Donatello -->
  <circle cx="100" cy="300" r="50" fill="green" />
  <rect x="90" y="270" width="20" height="60" fill="purple" />
  <text x="100" y="380" font-size="20" text-anchor="middle" fill="black">Donatello</text>

  <!-- Raphael -->
  <circle cx="300" cy="300" r="50" fill="green" />
  <rect x="290" y="270" width="20" height="60" fill="red" />
  <text x="300" y="380" font-size="20" text-anchor="middle" fill="black">Raphael</text>
</svg>